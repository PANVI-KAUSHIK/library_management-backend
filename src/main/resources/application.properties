spring.application.name=library-management-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA standard properties
jakarta.persistence.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/library_management}
jakarta.persistence.jdbc.user=${DB_USERNAME:root}
jakarta.persistence.jdbc.password=${DB_PASSWORD}
jakarta.persistence.jdbc.driver=com.mysql.cj.jdbc.Driver
